name: Custom Workflow

on:
  push:
    branches: [develop] # Only triggers when pushing to the develop branch

jobs:
  custom-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js 18
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install and Test
        # This tells GitHub to run the commands inside the sample-app folder
        working-directory: ./sample-app 
        run: |
          npm install
          npm test